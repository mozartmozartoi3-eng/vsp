<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Top arc: sweeping over top from left to right -->
    <path id="topArc" d="M 68,300 A 232,232 0 0,1 532,300" fill="none" />
    <!-- Bottom arc: sweeping over bottom from right to left so text baseline rests on outer rim -->
    <path id="bottomArc" d="M 532,300 A 232,232 0 0,1 68,300" fill="none" />
  </defs>

  <g transform="rotate(-3, 300, 300)">
    <!-- Outer concentric circle -->
    <circle cx="300" cy="300" r="275" fill="none" stroke="#0e4e9b" stroke-width="6" stroke-linecap="round" />

    <!-- Inner concentric circle -->
    <circle cx="300" cy="300" r="214" fill="none" stroke="#0e4e9b" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left & Right Stars -->
    <text x="82" y="309" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#0e4e9b" text-anchor="middle">★</text>
    <text x="518" y="309" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#0e4e9b" text-anchor="middle">★</text>

    <!-- Top Text along arc -->
    <text font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="bold" fill="#0e4e9b" letter-spacing="1.5">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">Voiture sans permis</textPath>
    </text>

    <!-- Bottom Text along arc -->
    <text font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="bold" fill="#0e4e9b" letter-spacing="1.5">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">Voiture sans permis</textPath>
    </text>

    <!-- Center capsule / oval border -->
    <rect x="140" y="244" width="320" height="112" rx="56" ry="56" fill="none" stroke="#0e4e9b" stroke-width="5" />

    <!-- Center text -->
    <text x="300" y="314" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#0e4e9b" text-anchor="middle">Jean auto vsp</text>
  </g>
</svg>